[env:genericGD32F305]
platform = ststm32
board = genericSTM32F103RC
framework = arduino
build_src_filter = +<main.cpp> -<main.cpp_>

; --- Programming / monitor ---
upload_protocol = stlink
monitor_speed = 115200

; IMPORTANT:
; We use genericSTM32F103RC for hardware/register compatibility.
; However, the actual chip is GD32F305RCT6, so we use a custom linker script
; with 96KB of RAM.
; Standalone firmware: the complete image starts at the flash base.
board_upload.offset_address = 0x08000000
board_build.ldscript = GD32F305RC_COMBOX.ld

build_flags =
    -D HSE_VALUE=8000000U
    -D GCC_VERSION=120301
    -D GD32F305
    -D GD32F30X_HD

extra_scripts = post:generate_hex.py

; --- Application hosted by the stock bootloader ---
; Same build, but linked at 0x08004000 so the stock bootloader (0x08000000-0x08003FFF)
; survives ST-Link uploads. generate_hex.py patches the 'G5RC' dword at image offset
; 0x150, which the bootloader validates at 0x08004150 before jumping (ORIGINAL_FIRMWARE.md §13).
; Recovery/back to standalone: flash combobox_bkp_40000.bin at 0x08000000.
[env:genericGD32F305_app]
extends = env:genericGD32F305
board_upload.offset_address = 0x08004000
board_build.flash_offset = 0x4000
board_build.ldscript = GD32F305RC_COMBOX_APP.ld
board_build.g5rc_magic = 1
board_build.firmware_outdir = compiled_firmware_app
