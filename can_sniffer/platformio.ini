; CAN bus sniffer — two targets (same sketch, pick env):
;   nanoatmega328new — Arduino Nano (ATmega328P, 5V) + MCP2515 + TJA1050
;   esp32dev         — ESP32 (LuaNode32, 3.3V) + SN65HVD230, built-in TWAI
;
; Nano: default assumes MCP2515 module with 8 MHz crystal and Optiboot
; (115200). Old bootloader: board = nanoatmega328; 16 MHz crystal:
; CAN_CLK = MCP_16MHZ in src/main.cpp.
; ESP32: LuaNode32 = standard ESP-WROOM-32 -> esp32dev; CP2102 USB-UART.

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can@^1.5.1

[env:esp32dev]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
